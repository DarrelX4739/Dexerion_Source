<!DOCTYPE html><html><head><meta charset="utf-8"><title>Dexerion Snip</title>
<style>
:root{
  color-scheme:dark;
  --bg:#f4f1eb; --bg2:#fbfaf7; --field:#fffefa; --sheet:#fffefa;
  --fg:#eceef3; --fg2:#c3c6d1; --muted:#8a8c99; --faint:#5c5e6b;
  --hover:rgba(255,255,255,.06); --active:rgba(255,255,255,.1);
  --hair:rgba(255,255,255,.08); --hair2:rgba(255,255,255,.14);
  --r:7px; --dur:150ms; --ease:cubic-bezier(.2,0,0,1);
  --font:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,sans-serif;
  --font-display:"Bahnschrift","Segoe UI Variable Display","Segoe UI",sans-serif;
  --font-mono:"Cascadia Mono",Consolas,ui-monospace,monospace;
  --accent:#35c4ff; --accent-ink:#07131a; --rec:#ff5a5a; --ok:#45d483;
}
[data-theme="light"]{
  color-scheme:light;
  --bg:#f6f6f4; --bg2:#ffffff; --field:#ffffff; --sheet:#fbfbfa;
  --fg:#15151a; --fg2:#3d3f49; --muted:#6b6d78; --faint:#9b9da6;
  --hover:rgba(16,16,20,.05); --active:rgba(16,16,20,.09);
  --hair:rgba(16,16,20,.1); --hair2:rgba(16,16,20,.16);
  --accent-ink:#ffffff; --rec:#c43434; --ok:#14884a;
}
*{box-sizing:border-box;font-family:var(--font);color:var(--fg)}
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:transparent}
#stage{position:fixed;inset:0;cursor:crosshair;background:transparent}
#frozen{position:fixed;inset:0;width:100%;height:100%;object-fit:fill;user-select:none;-webkit-user-drag:none;pointer-events:none;background:transparent}
#frozen[src=""]{display:none}
/* top toolbar */
#bar{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:20;cursor:default;
  display:flex;align-items:center;gap:4px;padding:6px 8px;border-radius:12px;
  background:color-mix(in srgb,var(--bg2) 88%,transparent);
  backdrop-filter:blur(24px) saturate(1.3);-webkit-backdrop-filter:blur(24px) saturate(1.3);
  border:1px solid var(--hair2);box-shadow:0 18px 50px -18px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.05)}
[data-theme="light"] #bar{box-shadow:0 18px 44px -20px rgba(20,20,30,.3),inset 0 1px 0 #fff}
#bar .logo{font-family:var(--font-display);font-size:11px;font-weight:700;letter-spacing:.14em;
  text-transform:uppercase;color:var(--fg);margin:0 8px 0 6px;white-space:nowrap;display:flex;align-items:center;gap:6px}
#bar .logo svg{color:var(--accent)}
#bar button{background:none;border:1px solid transparent;color:var(--fg2);border-radius:var(--r);
  padding:6px 11px;font-size:12.5px;font-weight:550;cursor:pointer;white-space:nowrap;
  display:inline-flex;align-items:center;gap:6px;
  transition:background var(--dur) var(--ease),color var(--dur) var(--ease),border-color var(--dur) var(--ease)}
#bar button svg{opacity:.8}
#bar button:hover{background:var(--hover);color:var(--fg)}
#bar button.on{background:color-mix(in srgb,var(--accent) 16%,transparent);
  border-color:color-mix(in srgb,var(--accent) 45%,transparent);color:var(--fg)}
#bar button.on svg{opacity:1;color:var(--accent)}
#bar #close{color:var(--muted);padding:6px 8px}
#hint{font-size:11.5px;color:var(--faint);margin-left:6px;white-space:nowrap}
/* selection rect: accent border + darkened surround */
#sel{position:fixed;z-index:10;border:1.5px solid var(--accent);border-radius:3px;
  box-shadow:0 0 0 9999px rgba(0,0,0,.42),0 0 0 1px rgba(0,0,0,.35);pointer-events:none}
#sel[hidden]{display:none}
/* quick actions near selection */
#actions{position:fixed;z-index:30;cursor:default;display:flex;gap:5px;padding:5px;border-radius:10px;
  background:color-mix(in srgb,var(--bg2) 90%,transparent);
  backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  border:1px solid var(--hair2);box-shadow:0 14px 40px -16px rgba(0,0,0,.7);
  animation:snipin .14s var(--ease) both}
@keyframes snipin{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
#actions[hidden]{display:none}
#actions button{background:var(--sheet);color:var(--fg);border:1px solid var(--hair);
  border-radius:6px;padding:6px 11px;font-size:12.5px;font-weight:550;cursor:pointer;
  display:inline-flex;align-items:center;gap:6px;
  transition:background var(--dur) var(--ease),border-color var(--dur) var(--ease)}
#actions button:hover{background:var(--active);border-color:var(--hair2)}
#actions button.ghost{background:none;color:var(--muted)}
/* video record panel: a proper card in idle mode, a Stop strip while recording */
#recpanel{position:fixed;top:70px;left:50%;transform:translateX(-50%);z-index:20;cursor:default;
  display:flex;flex-direction:column;align-items:stretch;gap:10px;padding:14px 16px;border-radius:14px;
  width:min(380px,calc(100vw - 32px));
  font-size:12.5px;color:var(--fg);
  background:color-mix(in srgb,var(--bg2) 90%,transparent);
  backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  border:1px solid var(--hair2);box-shadow:0 18px 50px -18px rgba(0,0,0,.7)}
#recpanel[hidden]{display:none}
.rec-title{font-family:var(--font-display);font-size:13px;font-weight:700;letter-spacing:.02em;
  display:flex;align-items:center;gap:8px}
.rec-title .dot{width:9px;height:9px;border-radius:50%;background:var(--rec);box-shadow:0 0 10px var(--rec)}
.rec-sub{font-size:12px;color:var(--muted);margin-top:-6px}
#recpanel label{display:flex;flex-direction:column;align-items:stretch;gap:6px;color:var(--muted);font-size:11.5px;font-weight:600;
  text-transform:uppercase;letter-spacing:.08em}
#recpanel select{max-width:none;width:100%;background:var(--field);color:var(--fg);border:1px solid var(--hair);
  border-radius:var(--r);padding:8px 10px;font-size:12.5px;text-transform:none;letter-spacing:normal;font-weight:500}
.rec-hint{font-size:11.5px;color:var(--faint);line-height:1.5}
#rec-start{background:var(--rec);border:none;color:#fff;font-weight:700;border-radius:var(--r);
  padding:10px 14px;cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center;gap:8px}
#rec-start:hover{filter:brightness(1.08)}
#rec-start:disabled{opacity:.55;cursor:default}
#rec-live{display:flex;align-items:center;gap:10px}
#rec-live .dot{width:9px;height:9px;border-radius:50%;background:var(--rec);flex:none;
  box-shadow:0 0 10px var(--rec);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.25}}
#rec-t{font-family:var(--font-mono);font-variant-numeric:tabular-nums;font-weight:700}
#rec-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  font-size:11.5px;color:var(--muted)}
#rec-stop{background:var(--rec);border:none;color:#fff;font-weight:700;border-radius:var(--r);padding:7px 16px;cursor:pointer;flex:none}
#rec-stop:hover{filter:brightness(1.08)}
#rec-cancel{background:none;border:1px solid transparent;color:var(--muted);border-radius:var(--r);
  padding:7px 10px;cursor:pointer;font-size:12.5px;font-weight:550;flex:none}
#rec-cancel:hover{background:var(--hover);color:var(--fg)}
/* recording: the main process shrinks this view to a Stop strip, so the panel
   becomes the strip itself — Stop stays one click away, nothing gets stranded */
body.recording #bar,body.recording #sel,body.recording #actions,
body.recording #frozen,body.recording #preview,body.recording #busy{display:none!important}
/* the start/stop toasts would cover the 52px strip, so they stay hidden until
   the strip exits recording mode (onRecStop removes the class before toasting) */
body.recording #toast{display:none!important}
body.recording #stage{cursor:default}
body.recording #recpanel{position:fixed;inset:0;top:0;left:0;transform:none;width:100%;height:100%;
  border-radius:10px;padding:6px 10px;gap:0;justify-content:center;
  flex-direction:row;align-items:center}
body.recording .rec-idle{display:none!important}
body.recording #rec-live{width:100%}
/* preview modal */
#preview{position:fixed;inset:0;z-index:40;cursor:default;display:grid;place-items:center;background:rgba(6,6,9,.55)}
#preview[hidden]{display:none}
.pv-card{max-width:82vw;max-height:88vh;display:flex;flex-direction:column;gap:10px;padding:12px;
  border-radius:16px;background:color-mix(in srgb,var(--bg2) 94%,transparent);
  backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);
  border:1px solid var(--hair2);box-shadow:0 30px 80px -24px rgba(0,0,0,.8);
  animation:snipin .16s var(--ease) both}
[data-theme="light"] .pv-card{box-shadow:0 30px 70px -24px rgba(20,20,30,.35),inset 0 1px 0 #fff}
.pv-box{display:grid;place-items:center;min-height:120px}
.pv-box img,.pv-box video{max-width:78vw;max-height:62vh;border-radius:9px;border:1px solid var(--hair)}
.pv-bar{display:flex;align-items:center;gap:7px;padding:0 2px}
.pv-bar span{flex:1;font-size:11.5px;color:var(--faint);font-family:var(--font-mono);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pv-bar button{background:var(--sheet);color:var(--fg);border:1px solid var(--hair);
  border-radius:var(--r);padding:7px 13px;font-size:12.5px;font-weight:550;cursor:pointer;
  display:inline-flex;align-items:center;gap:6px;
  transition:background var(--dur) var(--ease),border-color var(--dur) var(--ease)}
.pv-bar button:hover{background:var(--active);border-color:var(--hair2)}
.pv-bar button.ghost{background:none;color:var(--muted)}
/* busy + toast */
#busy{position:fixed;inset:0;z-index:50;cursor:wait;display:grid;place-items:center;background:rgba(6,6,9,.45)}
#busy[hidden]{display:none}
#busy .card{display:flex;align-items:center;gap:11px;padding:12px 18px;border-radius:12px;
  font-size:13px;color:var(--fg);
  background:color-mix(in srgb,var(--bg2) 92%,transparent);
  border:1px solid var(--hair2);box-shadow:0 20px 50px -20px rgba(0,0,0,.7)}
.spin{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--hair2);border-top-color:var(--accent);
  animation:snspin .7s linear infinite}
@keyframes snspin{to{transform:rotate(360deg)}}
#toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);z-index:60;cursor:default;
  padding:9px 18px;border-radius:var(--r-pill,999px);font-size:12.5px;font-weight:550;
  color:var(--fg);white-space:nowrap;
  background:color-mix(in srgb,var(--bg2) 94%,transparent);
  border:1px solid var(--hair2);box-shadow:0 12px 34px -14px rgba(0,0,0,.7);
  animation:snipin .16s var(--ease) both}
#toast[hidden]{display:none}
/* nof1 shared overlay tokens; recording remains a semantic red */
:root {
  --bg:#f4f1eb; --bg2:#fbfaf7; --field:#fffefa; --sheet:#fffefa;
  --fg:#24211d; --fg2:#5f5a51; --muted:#817a70; --faint:#aaa196;
  --hover:rgba(36,33,29,.045); --active:rgba(36,33,29,.075);
  --hair:rgba(36,33,29,.12); --hair2:rgba(36,33,29,.2); --r:10px; --rec:#c2413b; --ok:#2f7d4a;
  --font-display:"Iowan Old Style","Palatino Linotype",Georgia,serif;
}
[data-theme="dark"] {
  --bg:#171614; --bg2:#211f1c; --field:#1b1a17; --sheet:#1b1a17;
  --fg:#f4f0e8; --fg2:#c7c0b5; --muted:#a49c90; --faint:#726d65;
  --hover:rgba(255,255,255,.055); --active:rgba(255,255,255,.09);
  --hair:rgba(255,255,255,.11); --hair2:rgba(255,255,255,.18); --rec:#e06a63; --ok:#77c88d;
}
#bar, #actions, #recpanel, .pv-card, #busy .card, #toast { border-radius:14px; background:color-mix(in srgb,var(--bg2) 97%,transparent); }
@media (prefers-reduced-motion:reduce) {
  *,*::before,*::after { animation-duration:.01ms!important; animation-iteration-count:1!important; transition-duration:.01ms!important; }
}

</style>
</head><body>
<div id="stage">
  <img id="frozen" alt="">
  <div id="bar">
    <span class="logo"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="6.5" r="2.6"/><circle cx="6" cy="17.5" r="2.6"/><path d="M8.2 8.1 20 18M20 6 8.2 15.9"/></svg>Snip</span>
    <button data-mode="area" class="on">Area snip</button>
    <button data-mode="full">Full page</button>
    <button data-mode="video">Video</button>
    <span id="hint">Drag to select — click captures visible area</span>
    <button id="close" title="Cancel (Esc)"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </div>
  <div id="sel" hidden></div>
  <div id="actions" hidden>
    <button id="a-copy">Copy</button>
    <button id="a-save">Save</button>
    <button id="a-attach" hidden>Attach to chat</button>
    <button id="a-prev">Preview</button>
    <button id="a-x" class="ghost" title="Dismiss"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </div>
  <div id="recpanel" hidden>
    <div class="rec-idle" style="display:contents">
    <div class="rec-title"><span class="dot"></span>Record video</div>
    <div class="rec-sub">Captures motion as a WebM file you can save or keep.</div>
    <label>Source
      <select id="src" title="Capture source"></select>
    </label>
    <button id="rec-start">● Record</button>
    <div class="rec-hint">This window is pre-selected. While recording, a Stop bar stays pinned at the top of the page.</div>
    </div>
    <div id="rec-live" hidden><span class="dot"></span><span id="rec-t">00:00</span><span id="rec-name"></span><button id="rec-stop">Stop</button><button id="rec-cancel" title="Discard this recording">Cancel</button></div>
  </div>
  <div id="preview" hidden>
    <div class="pv-card">
      <div class="pv-box"><img id="pv-img" hidden><video id="pv-vid" hidden controls></video></div>
      <div class="pv-bar"><span id="pv-meta"></span>
        <button id="pv-copy">Copy</button><button id="pv-save">Save</button><button id="pv-attach" hidden>Attach to chat</button>
        <button id="pv-retake" class="ghost">Retake</button><button id="pv-close" class="ghost" title="Close"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      </div>
    </div>
  </div>
  <div id="busy" hidden><div class="card"><span class="spin"></span><span id="busy-tx">Capturing…</span></div></div>
  <div id="toast" hidden></div>
</div>
<script>
const $ = (s) => document.querySelector(s);
let mode = 'area';
let attachMode = false;
let selfSourceId = ''; // exact capture id of this window (see dex:snip-init)
let drag = null, rect = null;          // rect in overlay CSS px
let previewUrl = null, previewKind = 'snip';
let previewVideoUrl = null; // object URL for the recorded clip (revoked on retake)
let recVideoBlob = null;
let recVideoSecs = 0;
let frozenShot = null, frozenImg = null; // frozen tab frame (see dex:snip-init)

window.dexerion.on('dex:snip-init', (d) => {
  document.documentElement.dataset.theme = (d && d.theme) || 'dark';
  document.documentElement.style.setProperty('--accent', (d && d.accent) || '#35c4ff');
  // Attach mode (opened from the AI composer): offer "Attach to chat"
  // wherever a finished capture is shown.
  attachMode = Boolean(d && d.attach);
  $('#a-attach').hidden = !attachMode;
  $('#pv-attach').hidden = !attachMode;
  // Exact capture id of this window: recording pins to it by id, so the clip
  // can never come from a look-alike window underneath.
  selfSourceId = (d && d.mediaSourceId) || '';
  if (attachMode) $('#hint').textContent = 'Drag to select for the chat — click captures visible area';
  // Frozen page frame: the window is opaque (transparency is unusable on
  // this compositor), so this image IS the page the user sees and selects.
  frozenShot = (d && d.shot && d.shot.dataUrl) ? d.shot : null;
  frozenImg = null;
  if (frozenShot) {
    $('#frozen').src = frozenShot.dataUrl;
    try {
      frozenImg = new Image();
      frozenImg.src = frozenShot.dataUrl;
    } catch { frozenImg = null; }
  } else {
    toast('Live page unavailable — captures run on demand');
  }
});

// Crop the frozen frame to an overlay-CSS-px rect. Full-bleed rects reuse
// the original PNG with no re-encode loss.
function cropFrozen(r) {
  return new Promise((resolve, reject) => {
    if (!frozenShot || !frozenShot.dataUrl) { reject(new Error('no frozen frame')); return; }
    const im = (frozenImg && frozenImg.naturalWidth) ? frozenImg
      : Object.assign(new Image(), { src: frozenShot.dataUrl });
    if (!frozenImg || !frozenImg.naturalWidth) frozenImg = im;
    const go = () => {
      try {
        if (!im.naturalWidth || !im.naturalHeight) throw new Error('frozen frame unreadable');
        const sx = im.naturalWidth / Math.max(1, window.innerWidth);
        const sy = im.naturalHeight / Math.max(1, window.innerHeight);
        const x = Math.max(0, Math.round(r.x * sx)), y = Math.max(0, Math.round(r.y * sy));
        const w = Math.min(im.naturalWidth - x, Math.round(r.w * sx));
        const h = Math.min(im.naturalHeight - y, Math.round(r.h * sy));
        if (w < 2 || h < 2) throw new Error('selection too small');
        if (x <= 0 && y <= 0 && w >= im.naturalWidth && h >= im.naturalHeight) { resolve(frozenShot.dataUrl); return; }
        const cv = document.createElement('canvas');
        cv.width = w; cv.height = h;
        cv.getContext('2d').drawImage(im, x, y, w, h, 0, 0, w, h);
        resolve(cv.toDataURL('image/png'));
      } catch (err) { reject(err); }
    };
    if (im.complete && im.naturalWidth) go();
    else { im.onload = go; im.onerror = () => reject(new Error('frozen frame unreadable')); }
  });
}

function toast(msg, ms) {
  const t = $('#toast'); t.textContent = msg; t.hidden = false;
  clearTimeout(t._x); t._x = setTimeout(() => { t.hidden = true; }, ms || 2600);
}
function busy(on, tx) {
  $('#busy').hidden = !on;
  if (tx) $('#busy-tx').textContent = tx;
}
function dismiss() { window.dexerion.invoke('dex:snip-dismiss').catch(() => {}); }
$('#close').onclick = () => { if (recorder) { toast('Stop the recording first'); return; } dismiss(); };
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { if (recorder) { toast('Stop the recording first'); return; } dismiss(); }
});

// ---------- mode tabs ----------
document.querySelectorAll('#bar [data-mode]').forEach(b => b.onclick = () => setMode(b.dataset.mode));
function setMode(m) {
  if (recorder && m !== 'video') { toast('Stop the recording first'); return; }
  mode = m;
  document.querySelectorAll('#bar [data-mode]').forEach(b => b.classList.toggle('on', b.dataset.mode === m));
  clearSel();
  $('#recpanel').hidden = m !== 'video';
  $('#hint').textContent = m === 'area' ? 'Drag to select — click captures visible area'
    : m === 'full' ? 'Captures the whole page, top to bottom' : 'This window is pre-selected — press Record';
  if (m === 'full') doFull();
  if (m === 'video') loadSources();
}

// ---------- area selection (crosshair drag) ----------
const stage = $('#stage'), sel = $('#sel'), acts = $('#actions');
stage.addEventListener('pointerdown', (e) => {
  if (mode !== 'area' || e.button !== 0) return;
  if (e.target.closest('#bar,#actions,#preview,#recpanel')) return;
  if (rect && (e.clientX < rect.x || e.clientY < rect.y || e.clientX > rect.x + rect.w || e.clientY > rect.y + rect.h)) {
    clearSel();
    return;
  }
  drag = { x0: e.clientX, y0: e.clientY };
  stage.setPointerCapture(e.pointerId);
});
stage.addEventListener('pointermove', (e) => {
  if (!drag) return;
  rect = norm(drag.x0, drag.y0, e.clientX, e.clientY);
  paintSel();
});
stage.addEventListener('pointerup', (e) => {
  if (!drag) return;
  rect = norm(drag.x0, drag.y0, e.clientX, e.clientY);
  drag = null;
  if (rect.w < 5 || rect.h < 5) { // plain click = visible area
    rect = { x: 0, y: 0, w: window.innerWidth, h: window.innerHeight };
    doCapture('prev');
  } else { paintSel(); showActions(); }
});
function norm(x0, y0, x1, y1) {
  return { x: Math.round(Math.min(x0, x1)), y: Math.round(Math.min(y0, y1)),
           w: Math.round(Math.abs(x1 - x0)), h: Math.round(Math.abs(y1 - y0)) };
}
function paintSel() {
  sel.hidden = false;
  sel.style.left = rect.x + 'px'; sel.style.top = rect.y + 'px';
  sel.style.width = rect.w + 'px'; sel.style.height = rect.h + 'px';
}
function clearSel() { rect = null; sel.hidden = true; acts.hidden = true; }
function showActions() {
  acts.hidden = false;
  const ax = Math.max(8, Math.min(rect.x + rect.w - acts.offsetWidth - 4, window.innerWidth - acts.offsetWidth - 8));
  const below = rect.y + rect.h + 10;
  const ay = below + 52 < window.innerHeight ? below : Math.max(8, rect.y - 52);
  acts.style.left = ax + 'px'; acts.style.top = ay + 'px';
}

async function copyImage(dataUrl) {
  if (!dataUrl) throw new Error('empty image');
  const copied = await window.dexerion.invoke('dex:snip-copy', { dataUrl });
  if (!copied) throw new Error('The image could not be copied.');
}

// capture the current rect; 'copy' | 'save' | 'prev' | 'attach'
async function doCapture(how) {
  if (!rect) return;
  acts.hidden = true;
  busy(true, 'Capturing…');
  try {
    let dataUrl;
    if (frozenShot && frozenShot.dataUrl) dataUrl = await cropFrozen(rect);
    else {
      const r = await window.dexerion.invoke('dex:snip-area', rect);
      if (!r || !r.dataUrl) throw new Error('empty capture');
      dataUrl = r.dataUrl;
    }
    busy(false);
    if (how === 'copy') { await copyImage(dataUrl); toast('Copied ✓ — paste it anywhere'); clearSel(); dismiss(); }
    else if (how === 'save') { const r = await saveImage(dataUrl, 'snip'); if (r && !r.canceled) { clearSel(); dismiss(); } }
    else if (how === 'attach') { await attachImage(dataUrl); clearSel(); dismiss(); }
    else showPreview(dataUrl, 'snip');
  } catch (err) { busy(false); toast('Capture failed: ' + (err.message || err)); }
}
$('#a-copy').onclick = () => doCapture('copy');
$('#a-save').onclick = () => doCapture('save');
$('#a-attach').onclick = () => doCapture('attach');
$('#a-prev').onclick = () => doCapture('prev');
$('#a-x').onclick = clearSel;

// ---------- full page (scroll + stitch) ----------
async function doFull() {
  busy(true, 'Capturing full page…');
  try {
    const r = await window.dexerion.invoke('dex:snip-full');
    if (r.dataUrl) { busy(false); showPreview(r.dataUrl, 'full'); return; }
    busy(true, 'Stitching ' + r.parts.length + ' shots…');
    const url = await stitch(r.parts, r.scale, r.totalH);
    busy(false);
    showPreview(url, 'full');
  } catch (err) { busy(false); toast('Full-page capture failed: ' + (err.message || err)); setMode('area'); }
}
function loadImg(src) {
  return new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = src; });
}
async function stitch(parts, scale, totalH) {
  const first = await loadImg(parts[0].dataUrl);
  const cv = document.createElement('canvas');
  cv.width = first.width;
  cv.height = Math.max(first.height, Math.round(totalH * scale));
  const cx = cv.getContext('2d');
  for (const p of parts) {
    const im = await loadImg(p.dataUrl);
    cx.drawImage(im, 0, Math.round(p.y * scale));
  }
  return cv.toDataURL('image/png');
}

// ---------- preview: copy / save / attach / retake ----------
async function attachImage(url) {
  if (!url) { toast('Nothing to attach'); return; }
  try {
    await window.dexerion.invoke('dex:snip-attach', { dataUrl: url });
    toast('Attached ✓ — back in the chat');
  } catch (err) { toast('Attach failed: ' + (err.message || err)); throw err; }
}
function showPreview(url, kind) {
  previewUrl = url; previewKind = kind; recVideoBlob = null;
  revokeVideoUrl();
  $('#pv-img').src = url; $('#pv-img').hidden = false; $('#pv-vid').hidden = true;
  $('#pv-copy').style.display = '';
  const kb = Math.round(url.length * 3 / 4 / 1024);
  $('#pv-meta').textContent = (kind === 'full' ? 'Full page' : 'Snip') + ' • PNG • ~' + kb + ' KB';
  $('#preview').hidden = false;
}
function revokeVideoUrl() {
  if (previewVideoUrl) { try { URL.revokeObjectURL(previewVideoUrl); } catch {} previewVideoUrl = null; }
  try { $('#pv-vid').removeAttribute('src'); } catch {}
  try { $('#pv-vid').load(); } catch {}
}
function showVideoPreview(blob, secs) {
  recVideoBlob = blob; previewUrl = null;
  revokeVideoUrl();
  const u = URL.createObjectURL(blob);
  previewVideoUrl = u;
  $('#pv-vid').src = u; $('#pv-vid').hidden = false; $('#pv-img').hidden = true;
  $('#pv-copy').style.display = 'none';
  $('#pv-meta').textContent = 'Recording • WebM • ' + fmtT((secs || 0) * 1000).replace(/^(\d\d):(\d\d)$/, '$1m $2s')
    + ' • ' + (blob.size / 1048576).toFixed(1) + ' MB';
  $('#preview').hidden = false;
}
async function saveImage(url, kind) {
  const r = await window.dexerion.invoke('dex:snip-save', { dataUrl: url, kind });
  if (r && r.canceled) { toast('Save cancelled'); return r; }
  toast('Saved ✓ ' + ((r && r.name) || 'screenshot'));
  return r;
}
$('#pv-copy').onclick = async () => {
  if (!previewUrl) return;
  try {
    await copyImage(previewUrl);
    toast('Copied ✓ — paste it anywhere');
    dismiss();
  } catch (err) { toast('Copy failed: ' + (err.message || err)); }
};
$('#pv-save').onclick = async () => {
  try {
    if (recVideoBlob) {
      const buf = await recVideoBlob.arrayBuffer();
      const r = await window.dexerion.invoke('dex:snip-save-video', { buf, mime: recVideoBlob.type });
      if (r && r.canceled) { toast('Save cancelled — preview kept open'); } else { toast('Saved ✓ ' + ((r && r.name) || 'recording')); dismiss(); }
    } else if (previewUrl) {
      const r = await saveImage(previewUrl, previewKind);
      if (r && !r.canceled) dismiss();
    }
  } catch (err) { toast('Save failed: ' + (err.message || err)); }
};
$('#pv-attach').onclick = async () => {
  if (!previewUrl) return;
  try { await attachImage(previewUrl); dismiss(); }
  catch {}
};
$('#pv-retake').onclick = () => { $('#preview').hidden = true; previewUrl = null; recVideoBlob = null; revokeVideoUrl(); clearSel(); if (mode === 'full') setMode('area'); };
$('#pv-close').onclick = () => { $('#preview').hidden = true; previewUrl = null; recVideoBlob = null; revokeVideoUrl(); clearSel(); };

// ---------- video recording (window capture + MediaRecorder) ----------
// Pinned to this window by its exact capture id: the clip always comes from
// the window you are looking at, never a window underneath. Screens stay
// available in the picker for full-display captures.
let recorder = null, recStream = null, recChunks = [], recT0 = 0, recTimer = null, recDiscard = false;
let lastSources = []; // last dex:snip-sources list, so the button label follows the picker
function friendlySource(s, idx, list) {
  if ((s && s.isSelf) || (selfSourceId && s && s.id === selfSourceId)) return 'This window — Dexerion (recommended)';
  const id = String((s && s.id) || '');
  if (id.indexOf('screen:') === 0) {
    const n = list.filter(x => String(x.id || '').indexOf('screen:') === 0).indexOf(s) + 1;
    return 'Entire screen' + (n > 1 ? ' ' + n : '') + ' — everything visible';
  }
  return String((s && s.name) || s.id || 'Unknown source');
}
async function loadSources() {
  const box = $('#src'); box.innerHTML = '<option>Loading…</option>';
  $('#rec-start').disabled = true;
  try {
    const list = await window.dexerion.invoke('dex:snip-sources');
    box.innerHTML = '';
    if (!list || !list.length) { box.innerHTML = '<option value="">No sources</option>'; return; }
    for (const s of list) {
      const o = document.createElement('option');
      o.value = s.id; o.textContent = friendlySource(s, 0, list);
      box.appendChild(o);
    }
    // Pre-select this window (flagged by main, or matched by exact id).
    let pick = list.findIndex(s => s.isSelf || (selfSourceId && s.id === selfSourceId));
    if (pick < 0) pick = 0;
    box.selectedIndex = pick;
    lastSources = list;
    syncRecButton();
    $('#rec-start').disabled = false;
  } catch (err) { box.innerHTML = '<option value="">Unavailable</option>'; toast('Video sources failed: ' + (err.message || err)); }
}
function syncRecButton() {
  const id = $('#src').value;
  const s = lastSources.find(x => x.id === id);
  const self = Boolean((s && s.isSelf) || (selfSourceId && id === selfSourceId));
  $('#rec-start').textContent = self ? '● Record this window' : '● Record';
}
$('#src').addEventListener('change', syncRecButton);
function fmtT(ms) {
  const s = Math.floor(ms / 1000);
  return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
}
$('#rec-start').onclick = async () => {
  if (recorder) return;
  const id = $('#src').value;
  if (!id) { toast('Pick a source first'); return; }
  $('#rec-start').disabled = true;
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      audio: false,
      video: { mandatory: { chromeMediaSource: 'desktop', chromeMediaSourceId: id, minWidth: 640, maxWidth: 3840, minHeight: 360, maxHeight: 2160 } },
    });
    const videoTrack = stream.getVideoTracks()[0];
    if (!videoTrack) { stream.getTracks().forEach(t => { try { t.stop(); } catch {} }); throw new Error('No video track from source'); }
    recStream = stream;
    const mime = ['video/webm;codecs=vp9', 'video/webm;codecs=vp8', 'video/webm']
      .find(m => { try { return MediaRecorder.isTypeSupported(m); } catch { return false; } }) || '';
    recChunks = [];
    recorder = new MediaRecorder(stream, mime ? { mimeType: mime, videoBitsPerSecond: 8000000 } : undefined);
    recorder.ondataavailable = (e) => { if (e.data && e.data.size) recChunks.push(e.data); };
    recorder.onerror = () => { try { toast('Recording error — stopping'); } catch {} stopRec(); };
    recorder.onstop = onRecStop;
    recorder.start(250);
    recT0 = Date.now();
    recDiscard = false;
    $('#rec-t').textContent = '00:00';
    try { $('#rec-name').textContent = $('#src').selectedOptions[0].textContent || ''; } catch { $('#rec-name').textContent = ''; }
    clearInterval(recTimer);
    recTimer = setInterval(() => {
      $('#rec-t').textContent = fmtT(Date.now() - recT0);
      if (Date.now() - recT0 > 10 * 60 * 1000) stopRec(); // 10-min cap
    }, 500);
    $('#rec-start').hidden = true; $('#rec-live').hidden = false;
    document.body.classList.add('recording');
    window.dexerion.invoke('dex:snip-recstate', { recording: true }).catch(() => {});
    // No toast here: it would cover the 52px Stop strip. The strip itself
    // plus the red toolbar button are the recording indicators.
  } catch (err) {
    $('#rec-start').disabled = false;
    toast('Recording failed: ' + (err.message || err));
  }
};
function stopRec() { try { recorder && recorder.state !== 'inactive' && recorder.stop(); } catch {} }
$('#rec-stop').onclick = stopRec;
$('#rec-cancel').onclick = () => { // throw this take away, back to the panel
  if (!recorder) return;
  recDiscard = true;
  stopRec();
};
function onRecStop() {
  clearInterval(recTimer);
  try { recStream && recStream.getTracks().forEach(t => t.stop()); } catch {}
  document.body.classList.remove('recording');
  window.dexerion.invoke('dex:snip-recstate', { recording: false }).catch(() => {});
  const secs = Math.round((Date.now() - recT0) / 1000);
  const blob = new Blob(recChunks, { type: (recorder && recorder.mimeType) || 'video/webm' });
  const discarded = recDiscard;
  recorder = null; recStream = null; recChunks = []; recDiscard = false;
  $('#rec-start').hidden = false; $('#rec-start').disabled = false; $('#rec-live').hidden = true;
  if (discarded) { toast('Recording discarded'); return; }
  if (!blob.size) { toast('Recording produced no data — try another source'); return; }
  recVideoSecs = secs;
  showVideoPreview(blob, secs);
}
</script></body></html>
