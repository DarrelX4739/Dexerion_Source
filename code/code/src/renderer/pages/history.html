<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>History — Dexerion</title>
<link rel="stylesheet" href="dexerion://assets/page-theme.css">
<style>
.hint{color:var(--pfaint)}
</style>
</head><body><div class="dx-page">
<div class="dx-head">
  <div class="eyebrow">Library</div>
  <h1>History</h1>
  <p>Every page this profile has visited, newest first. Deleting an entry removes it permanently.</p>
</div>

<div class="dx-search">
  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
  <input id="q" type="search" aria-label="Search history" placeholder="Search history" autocomplete="off">
</div>

<div class="dx-list" id="list"></div>
</div>
<script src="dexerion://assets/page-theme.js"></script>
<script>
const list=document.getElementById('list');
function hueOf(h){let n=0;for(const c of h)n=(n*31+c.charCodeAt(0))%360;return n;}
function hostOf(u){try{return new URL(u).hostname.replace(/^www\./,'');}catch{return u||'';}}

function empty(title,sub){
  list.innerHTML='';
  const d=document.createElement('div');d.className='dx-empty';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=title;d.querySelector('span').textContent=sub;
  list.appendChild(d);
}

async function load(){
  const term=document.getElementById('q').value.trim();
  // A failed load must not look like an empty history: DexPage.guard shows
  // what went wrong and offers a retry.
  const h=await window.DexPage.guard(()=>window.dexerion.invoke('dex:history',term,300),()=>load());
  if(!h)return;
  list.innerHTML='';
  if(!h.length){empty(term?'No matches':'No history yet',term?'Nothing in your history matches “'+term+'”.':'Pages you visit will show up here.');return;}
  for(const x of h){
    const host=hostOf(x.url);
    const row=document.createElement('div');row.className='dx-item';

    const fav=document.createElement('span');fav.className='fav';
    fav.style.setProperty('--h',hueOf(host));
    fav.textContent=(host[0]||'◆').toUpperCase();

    const main=document.createElement('div');main.className='main';
    const b=document.createElement('b');b.textContent=x.title||x.url;
    const sm=document.createElement('small');sm.textContent=x.url;
    main.append(b,sm);
    main.onclick=()=>window.dexerion.invoke('dex:navigate',null,x.url);
    main.title='Open '+x.url;

    const del=document.createElement('button');del.className='btn ghost';del.textContent='Delete';
    del.onclick=async(e)=>{e.stopPropagation();await window.dexerion.invoke('dex:history-delete',x.url);load();};

    const acts=document.createElement('div');acts.className='actions';acts.appendChild(del);
    row.append(fav,main,acts);
    list.appendChild(row);
  }
}
document.getElementById('q').oninput=load;
load();
</script></body></html>
