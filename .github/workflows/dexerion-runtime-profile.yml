name: Dexerion runtime cost attribution
on:
  push:
    branches: [cpp-native-spike]
    paths:
      - '.github/workflows/dexerion-runtime-profile.yml'
      - 'experiments/runtime-profile/**'
permissions:
  contents: read

jobs:
  profile:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    timeout-minutes: 17
    env:
      E2E_LAUNCH_TIMEOUT_MS: '45000'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: code/build/package-lock.json
      - name: Verify original application tree and profiler summary
        shell: bash
        run: |
          test "$(git rev-parse HEAD:code)" = '9180619b50ea9f3da77c00f38648293e6a3422e7'
          node --test experiments/runtime-profile/test-profile-summary.cjs
          npm ci --prefix code/build
      - name: Measure unchanged Electron main process on Linux
        if: runner.os == 'Linux' && !contains(github.event.head_commit.message, '[profile-title]')
        shell: bash
        run: xvfb-run -a node experiments/runtime-profile/profile-main.cjs runtime-main-profile.json
      - name: Measure unchanged Electron main process on Windows
        if: runner.os == 'Windows' && !contains(github.event.head_commit.message, '[profile-title]')
        shell: bash
        run: node experiments/runtime-profile/profile-main.cjs runtime-main-profile.json
      - name: Profile title-only update work in the unchanged app on Linux
        if: runner.os == 'Linux' && contains(github.event.head_commit.message, '[profile-title]')
        shell: bash
        run: xvfb-run -a node experiments/runtime-profile/profile-title.cjs runtime-title-profile.json
      - name: Profile title-only update work in the unchanged app on Windows
        if: runner.os == 'Windows' && contains(github.event.head_commit.message, '[profile-title]')
        shell: bash
        run: node experiments/runtime-profile/profile-title.cjs runtime-title-profile.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dexerion-runtime-cost-${{ matrix.os }}
          path: |
            runtime-main-profile.json
            runtime-title-profile.json
          if-no-files-found: ignore
          retention-days: 7
