name: Dexerion C++ experiment
on:
  push:
    branches: [cpp-native-spike]
  workflow_dispatch:
permissions:
  contents: read

jobs:
  regression:
    if: github.ref == 'refs/heads/cpp-native-spike'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 18
    env:
      E2E_LAUNCH_TIMEOUT_MS: '45000'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: code/build/package-lock.json
      - uses: actions/checkout@v4
        with:
          ref: 64da61e4fbe16b6d7f3fe58752a90517569d45bf
          path: .electron-reference
          persist-credentials: false
      - name: Compare tracked production tree to the copied commit
        shell: bash
        run: |
          ref_tree="$(git -C .electron-reference rev-parse HEAD:code)"
          branch_tree="$(git rev-parse HEAD:code)"
          [[ "$ref_tree" == "$branch_tree" ]]
          [[ "$(git -C .electron-reference rev-parse HEAD:.github/workflows/release.yml)" == "$(git rev-parse HEAD:.github/workflows/release.yml)" ]]
          echo "Production source, tests, dependencies and release workflow have the original tree IDs."
      - name: Validate existing Electron implementation
        working-directory: code/build
        shell: bash
        run: |
          npm ci
          npm test
      - name: Exercise existing Electron app on Linux
        if: runner.os == 'Linux'
        working-directory: code/build
        run: xvfb-run -a npm run test:e2e -- e2e/boot.spec.js e2e/chat-batch-scroll.spec.js e2e/search.spec.js e2e/downloads-progress.spec.js e2e/cold-accounts.spec.js e2e/newtab-tasks.spec.js
      - name: Exercise existing Electron app on Windows
        if: runner.os == 'Windows'
        working-directory: code/build
        run: npm run test:e2e -- e2e/boot.spec.js e2e/chat-batch-scroll.spec.js e2e/search.spec.js e2e/downloads-progress.spec.js e2e/cold-accounts.spec.js e2e/newtab-tasks.spec.js

      - name: Run the carried-forward full Electron suite under Linux
        if: runner.os == 'Linux' && contains(github.event.head_commit.message, '[full]')
        working-directory: code/build
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends openbox x11-utils
          xvfb-run -a -s '-screen 0 1280x1024x24' bash -ec '
            openbox --sm-disable >/tmp/dex-cef-openbox.log 2>&1 &
            wm=$!
            trap "kill $wm 2>/dev/null || true" EXIT
            for i in {1..40}; do
              xprop -root _NET_SUPPORTING_WM_CHECK | grep -q "window id" && break
              sleep .25
            done
            xprop -root _NET_SUPPORTING_WM_CHECK | grep -q "window id"
            npm run test:e2e
          '

  native-cef:
    if: github.ref == 'refs/heads/cpp-native-spike' && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[cef]'))
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, sdk: linux64 }
          - { os: windows-latest, sdk: windows64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch the exact upstream CEF SDK
        env:
          CEF_PLATFORM: ${{ matrix.sdk }}
        run: |
          root="$(python experiments/cef-shell/fetch_sdk.py "$CEF_PLATFORM" "$RUNNER_TEMP/dex-cef-sdk")"
          echo "CEF_SDK_ROOT=$root" >> "$GITHUB_ENV"
      - name: Install Linux desktop SDK headers
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libx11-dev openbox x11-utils
      - name: Configure and build native CEF under Linux
        if: runner.os == 'Linux'
        run: |
          cmake -S experiments/cef-shell -B "$RUNNER_TEMP/dex-cef-build" -DCMAKE_BUILD_TYPE=Release -DCEF_ROOT="$CEF_SDK_ROOT"
          cmake --build "$RUNNER_TEMP/dex-cef-build" --parallel 3
      - name: Configure and build native CEF under Windows
        if: runner.os == 'Windows'
        run: |
          cmake -S experiments/cef-shell -B "$RUNNER_TEMP/dex-cef-build" -A x64 -DCEF_ROOT="$CEF_SDK_ROOT"
          cmake --build "$RUNNER_TEMP/dex-cef-build" --config Release --parallel 3
      - name: Render a loopback fixture with CEF on Linux
        if: runner.os == 'Linux'
        run: |
          app="$(find "$RUNNER_TEMP/dex-cef-build" -type f -name dexerion_cef_probe -print -quit)"
          test -n "$app"
          sandbox="$(dirname "$app")/chrome-sandbox"
          test -f "$sandbox"
          sudo chown root:root "$sandbox"
          sudo chmod 4755 "$sandbox"
          xvfb-run -a python experiments/cef-shell/smoke.py "$app"
      - name: Render a loopback fixture with CEF on Windows
        if: runner.os == 'Windows'
        run: |
          app="$(find "$RUNNER_TEMP/dex-cef-build" -type f -name dexerion_cef_probe.exe -print -quit)"
          test -n "$app"
          python experiments/cef-shell/smoke.py "$app"


      - uses: actions/setup-node@v4
        if: contains(github.event.head_commit.message, '[footprint]')
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: code/build/package-lock.json
      - name: Install the locked Electron comparison arm and pinned sampler
        if: contains(github.event.head_commit.message, '[footprint]')
        run: |
          npm ci --prefix code/build
          python -m pip install --only-binary=:all: psutil==7.2.2 'python-xlib==0.33; sys_platform == "linux"'
      - name: Measure separate disposable one-page launch trees
        if: contains(github.event.head_commit.message, '[footprint]')
        run: |
          electron="$(cd code/build && node -p "require('electron')" )"
          if [[ "$RUNNER_OS" == Windows ]]; then
            app="$(find "$RUNNER_TEMP/dex-cef-build" -type f -name dexerion_cef_probe.exe -print -quit)"
            python experiments/cef-shell/compare_footprint.py --cef "$app" --electron "$electron" --output footprint.json
          else
            app="$(find "$RUNNER_TEMP/dex-cef-build" -type f -name dexerion_cef_probe -print -quit)"
            helper="$(dirname "$electron")/chrome-sandbox"
            test -f "$helper"
            sudo chown root:root "$helper"
            sudo chmod 4755 "$helper"
            xvfb-run -a -s '-screen 0 1440x1024x24' bash -ec '
              openbox --sm-disable >/tmp/dex-cef-footprint-wm.log 2>&1 &
              wm=$!
              trap "kill $wm 2>/dev/null || true" EXIT
              for i in {1..40}; do
                xprop -root _NET_SUPPORTING_WM_CHECK | grep -q "window id" && break
                sleep .25
              done
              xprop -root _NET_SUPPORTING_WM_CHECK | grep -q "window id"
              python experiments/cef-shell/compare_footprint.py --cef "$1" --electron "$2" --output footprint.json
            ' bash "$app" "$electron"
          fi
      - uses: actions/upload-artifact@v4
        if: always() && contains(github.event.head_commit.message, '[footprint]')
        with:
          name: cef-prototype-footprint-${{ matrix.sdk }}
          path: footprint.json
          if-no-files-found: ignore
          retention-days: 7

  native-core:
    env:
      E2E_LAUNCH_TIMEOUT_MS: '45000'
    if: github.ref == 'refs/heads/cpp-native-spike'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build native algorithms and compare against original JS
        shell: bash
        run: |
          cmake -S experiments/native-core -B "$RUNNER_TEMP/dex-native-core" -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/dex-native-core" --config Release --parallel 3
          ctest --test-dir "$RUNNER_TEMP/dex-native-core" -C Release --output-on-failure

      - name: Install unchanged Electron test dependencies for a real-flow comparison
        working-directory: code/build
        run: npm ci
      - name: Replay actual hosted Electron decisions in C++ on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: xvfb-run -a node experiments/native-core/tests/electron_power_shadow.cjs "$RUNNER_TEMP/dex-native-core/dex_ap_replay"
      - name: Replay actual hosted Electron decisions in C++ on Windows
        if: runner.os == 'Windows'
        shell: bash
        run: node experiments/native-core/tests/electron_power_shadow.cjs "$RUNNER_TEMP/dex-native-core/Release/dex_ap_replay.exe"
