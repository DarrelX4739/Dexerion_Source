name: Dexerion refreshed dev checks
on:
  push:
    branches: [dev-V]
    paths:
      - '.github/workflows/dexerion-refreshed-dev.yml'
      - 'code/**'
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 22
    defaults:
      run:
        working-directory: code/build
    env:
      E2E_LAUNCH_TIMEOUT_MS: '55000'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: code/build/package-lock.json
      - name: Install locked runtime
        run: npm ci
      - name: Run code checks and unit tests
        shell: bash
        run: |
          set -e
          node scripts/verify-all.js
          node scripts/test-adaptive-power.js
          node scripts/test-nextgen-unit.js
          node scripts/test-polish-unit.js
          node scripts/test-scout-mapping.js
          shopt -s nullglob
          focused=(scripts/test-search-*cache.cjs scripts/test-chat-wire-image-budget.cjs scripts/test-provider-reasoning-cap.cjs scripts/test-provider-sse-scanning.cjs scripts/test-provider-control-channel.cjs scripts/test-files-search-offset.cjs scripts/test-lucide-shell.cjs  scripts/test-agent-deadline-lifecycle.cjs scripts/test-bookmark-membership.cjs scripts/test-scout-scoring-parity.cjs)
          if (( ${#focused[@]} )); then node --test "${focused[@]}"; fi
      - name: Exercise real segmented AI streaming on Windows
        if: runner.os == 'Windows'
        run: npm run test:e2e -- e2e/segmented-provider-stream.spec.js e2e/files-search-offset.spec.js e2e/image-stream-validation.spec.js
      - name: Exercise real segmented AI streaming on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:e2e -- e2e/segmented-provider-stream.spec.js e2e/files-search-offset.spec.js e2e/image-stream-validation.spec.js
      - name: Verify exact displayed shell icons on Windows
        if: runner.os == 'Windows'
        env:
          DEX_LUCIDE_DIAGNOSTIC_EXPECT: subset
        run: npm run test:e2e -- e2e/lucide-shell.spec.js
      - name: Verify exact displayed shell icons on Linux
        if: runner.os == 'Linux'
        env:
          DEX_LUCIDE_DIAGNOSTIC_EXPECT: subset
        run: xvfb-run -a npm run test:e2e -- e2e/lucide-shell.spec.js
      - name: Verify real planned-step cleanup on Windows
        if: runner.os == 'Windows'
        env:
          DEX_AGENT_DEADLINE_FIXTURE: candidate
        run: npm run test:e2e -- e2e/agent-deadline-lifecycle.spec.js
      - name: Verify real bookmark keyboard and navigation behavior on Windows
        if: runner.os == 'Windows'
        env:
          DEX_BOOKMARK_PHASE: candidate
          DEX_BOOKMARK_OUT: ${{ runner.temp }}/bookmark-membership-candidate.json
        run: npm run test:e2e -- e2e/bookmark-membership-native.spec.js
      - name: Exercise actual desktop and AI search on Windows
        if: runner.os == 'Windows'
        run: npm run test:e2e -- e2e/boot.spec.js e2e/sidebar.spec.js e2e/search.spec.js e2e/site-offline-assets.spec.js
      - name: Exercise actual desktop and AI search on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:e2e -- e2e/boot.spec.js e2e/sidebar.spec.js e2e/search.spec.js e2e/site-offline-assets.spec.js
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: refreshed-dev-failure-${{ matrix.os }}
          path: code/build/test-results/
          if-no-files-found: ignore
          retention-days: 7
