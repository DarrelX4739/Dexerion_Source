name: Dexerion native download redraw
on:
  push:
    branches: [darrel-dev-1]
    paths:
      - '.github/workflows/dexerion-download-performance.yml'
      - 'code/build/scripts/measure-download-redraw.cjs'
permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: code/build
    env:
      E2E_LAUNCH_TIMEOUT_MS: '45000'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: e157975849d00b5a4e4f2badce54a59a0cac3aa7
          path: .download-reference
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: code/build/package-lock.json
      - run: npm ci
      - name: Compare redraws during the same real local transfer
        run: |
          ref="$GITHUB_WORKSPACE/.download-reference/code/build"
          (cd "$ref" && npm ci)
          DEX_DOWNLOAD_REFERENCE_BUILD="$ref" xvfb-run -a -s '-screen 0 1280x1024x24' node scripts/measure-download-redraw.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-download-redraw-performance
          path: code/build/cloud-download-redraw.json
          if-no-files-found: ignore
          retention-days: 7
