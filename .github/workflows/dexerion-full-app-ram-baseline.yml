name: Dexerion full-app RAM compatibility baseline
on:
  push:
    branches: [darrel-dev-1]
    paths:
      - '.github/workflows/dexerion-full-app-ram-baseline.yml'
      - 'experiments/full-app-ram/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    if: github.ref == 'refs/heads/darrel-dev-1'
    runs-on: windows-latest
    timeout-minutes: 11
    env:
      DEX_RAM_REQUIRE_WINDOWS_SANDBOX_METRIC: '1'
      DEX_RAM_EXPECT_WEB_SANDBOX: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: code/build/package-lock.json
      - name: Install the checkout’s locked Electron and Playwright dependencies
        working-directory: code/build
        run: npm ci
      - name: Validate loopback and disposable profile controls
        run: node --test experiments/full-app-ram/full-app-baseline.test.cjs
      - name: Launch unchanged Dexerion with a disposable profile
        shell: pwsh
        run: |
          node experiments/full-app-ram/full-app-baseline.cjs | Tee-Object -FilePath full-app-ram-baseline.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ((Get-Content full-app-ram-baseline.json -Raw | ConvertFrom-Json).appModified -ne $false) {
            throw 'No verified stock app baseline'
          }
      - uses: actions/upload-artifact@v4
        with:
          name: dexerion-full-app-ram-baseline-windows
          path: full-app-ram-baseline.json
          if-no-files-found: error
          retention-days: 7
