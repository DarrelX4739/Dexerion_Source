name: Dexerion desktop regression controls
on:
  push:
    branches: [darrel-dev-1]
    paths:
      - '.github/workflows/dexerion-desktop-regression.yml'
permissions:
  contents: read

jobs:
  linux-desktop:
    strategy:
      fail-fast: false
      matrix:
        arm: [reference, first-chat, branch]
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    name: Linux desktop (${{ matrix.arm }})
    defaults:
      run:
        working-directory: code/build
    env:
      E2E_LAUNCH_TIMEOUT_MS: '45000'
      DEX_TRACE_INTENSIVE_AREAS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.arm == 'reference' && 'e157975849d00b5a4e4f2badce54a59a0cac3aa7' || matrix.arm == 'first-chat' && '47735216527534dc93bd868d3ce3f79182a55ec3' || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: code/build/package-lock.json
      - name: Install a window manager and locked test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends openbox x11-utils
          npm ci
          node -p "require('electron')"
      - name: Isolate the timed-out round and generated-site navigation
        run: |
          xvfb-run -a -s '-screen 0 1280x1024x24' bash -e -c '
            openbox --sm-disable >/tmp/dex-openbox.log 2>&1 &
            wm=$!
            trap "kill $wm 2>/dev/null || true" EXIT
            for i in {1..40}; do
              if xprop -root _NET_SUPPORTING_WM_CHECK | grep -q "window id"; then break; fi
              sleep 0.25
            done
            xprop -root _NET_SUPPORTING_WM_CHECK | grep -q "window id"
            npm run test:e2e -- e2e/nextgen-intensive.spec.js e2e/artifacts.spec.js --grep "intensive round 13:|a generated site edits"
          '
      - name: Keep desktop diagnostic evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-regression-failures-${{ matrix.arm }}
          path: code/build/test-results/
          if-no-files-found: ignore
          retention-days: 7
