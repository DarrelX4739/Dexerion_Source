name: Dexerion desktop regression controls
on:
  push:
    branches: [darrel-dev-1]
    paths:
      - '.github/workflows/dexerion-desktop-regression.yml'
permissions:
  contents: read

jobs:
  linux-desktop:
    strategy:
      fail-fast: false
      matrix:
        arm: [reference, branch]
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    name: Linux desktop (${{ matrix.arm }})
    defaults:
      run:
        working-directory: code/build
    env:
      E2E_LAUNCH_TIMEOUT_MS: '45000'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.arm == 'reference' && 'ce1ea874d339ceb639598f859bdfe8f298ef3ba2' || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: code/build/package-lock.json
      - name: Install a window manager and locked test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends openbox x11-utils
          npm ci
          node -p "require('electron')"
      - name: Recheck fullscreen geometry and report retry on a managed display
        run: |
          xvfb-run -a -s '-screen 0 1280x1024x24' bash -e -c '
            openbox --sm-disable >/tmp/dex-openbox.log 2>&1 &
            wm=$!
            trap "kill $wm 2>/dev/null || true" EXIT
            for i in {1..40}; do
              if xprop -root _NET_SUPPORTING_WM_CHECK | grep -q "window id"; then break; fi
              sleep 0.25
            done
            xprop -root _NET_SUPPORTING_WM_CHECK | grep -q "window id"
            npm run test:e2e -- e2e/artifacts.spec.js e2e/nextgen-intensive.spec.js e2e/preview-controls.spec.js e2e/report-write-retry.spec.js --grep "a generated site edits|intensive round 01:|site and report preview chrome|a missing report artifact"
          '
      - name: Keep desktop diagnostic evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-regression-failures-${{ matrix.arm }}
          path: code/build/test-results/
          if-no-files-found: ignore
          retention-days: 7
