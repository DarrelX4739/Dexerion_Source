name: Dexerion Windows optimisation regression
on:
  push:
    branches: [darrel-dev-1]
    paths:
      - '.github/workflows/dexerion-windows-optimisation.yml'
      - 'code/code/src/renderer/ai-sidebar.js'
      - 'code/code/src/renderer/ai-search.js'
      - 'code/code/src/renderer/pages/downloads.html'
      - 'code/code/src/renderer/pages/newtab.html'
      - 'code/code/src/main/profile.js'
      - 'code/build/e2e/chat-batch-scroll.spec.js'
      - 'code/build/e2e/downloads-progress.spec.js'
      - 'code/build/e2e/search.spec.js'
      - 'code/build/e2e/cold-accounts.spec.js'
permissions:
  contents: read

jobs:
  checks:
    runs-on: windows-latest
    timeout-minutes: 16
    defaults:
      run:
        shell: bash
        working-directory: code/build
    env:
      E2E_LAUNCH_TIMEOUT_MS: '45000'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: code/build/package-lock.json
      - name: Install the locked Windows runtime
        run: npm ci
      - name: Run syntax, contracts and focused tests
        run: npm test
      - name: Exercise real chat, search, download and accounts on Windows
        run: npm run test:e2e -- e2e/boot.spec.js e2e/chat-batch-scroll.spec.js e2e/search.spec.js e2e/downloads-progress.spec.js e2e/cold-accounts.spec.js e2e/newtab-tasks.spec.js
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: optimisation-regression-failures-windows
          path: code/build/test-results/
          if-no-files-found: ignore
          retention-days: 7
