name: Dexerion Electron candidate checks
on:
  push:
    branches: [darrel-dev-1]
    paths:
      - '.github/workflows/dexerion-engine-candidate.yml'
      - 'code/build/e2e/engine-candidate.spec.js'
      - 'code/build/e2e/boot.spec.js'
permissions:
  contents: read

jobs:
  candidate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
        working-directory: code/build
    env:
      DEX_ENGINE_CANDIDATE: '44.11.6'
      E2E_LAUNCH_TIMEOUT_MS: '45000'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: code/build/package-lock.json
      - name: Load the candidate runtime without changing the product lockfile
        run: |
          npm ci
          node -p "require('electron')"
          dir="$RUNNER_TEMP/dex-engine-candidate"
          mkdir -p "$dir"
          npm install --prefix "$dir" --no-save --no-package-lock --no-audit "electron@$DEX_ENGINE_CANDIDATE"
          node "$dir/node_modules/electron/install.js"
          node -e 'const p = require("node:path"); const fs = require("node:fs"); const dist = p.dirname(require(p.join(process.argv[1],"node_modules","electron"))); fs.appendFileSync(process.env.GITHUB_ENV,"ELECTRON_OVERRIDE_DIST_PATH="+dist+"\n")' "$dir"
      - name: Exercise the candidate in the real Linux application
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:e2e -- e2e/engine-candidate.spec.js e2e/boot.spec.js e2e/sidebar.spec.js e2e/search.spec.js e2e/site-offline-assets.spec.js e2e/performance-surfaces.spec.js
      - name: Exercise the candidate in the real Windows application
        if: runner.os == 'Windows'
        run: npm run test:e2e -- e2e/engine-candidate.spec.js e2e/boot.spec.js e2e/sidebar.spec.js e2e/search.spec.js e2e/site-offline-assets.spec.js e2e/performance-surfaces.spec.js
      - name: Keep candidate failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: engine-candidate-failures-${{ matrix.os }}
          path: code/build/test-results/
          if-no-files-found: ignore
          retention-days: 7
