name: Dexerion Windows shell style work
on:
  push:
    branches: [dev-V]
    paths:
      - '.github/workflows/dexerion-shell-accent-diagnostic.yml'
      - 'code/build/scripts/measure-shell-accent.cjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  shell-metrics:
    if: github.ref == 'refs/heads/dev-V'
    runs-on: windows-latest
    timeout-minutes: 12
    env:
      E2E_LAUNCH_TIMEOUT_MS: '30000'
    defaults:
      run:
        working-directory: code/build
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: code/build/package-lock.json
      - name: Install locked Electron
        run: npm ci
      - name: Compare real shell CDP metrics with exact same-source inputs
        shell: pwsh
        run: |
          node scripts/measure-shell-accent.cjs --self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/measure-shell-accent.cjs (Join-Path $env:RUNNER_TEMP 'dex-shell-accent.json')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --exit-code -- ../code/src/renderer/shell.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dexerion-windows-shell-accent-metrics
          path: ${{ runner.temp }}/dex-shell-accent.json
          if-no-files-found: ignore
          retention-days: 7
