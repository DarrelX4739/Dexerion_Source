name: Dexerion Edge cloud comparison
on:
  push:
    branches: [darrel-dev-1]
    paths:
      - '.github/workflows/dexerion-edge-cloud.yml'
      - 'code/build/scripts/measure-protocol.js'
      - 'code/build/scripts/measure-sample-guard.cjs'
      - 'code/build/scripts/measure-native-browser.cjs'
      - 'code/build/scripts/test-measure-native-browser.cjs'
      - 'code/build/scripts/measure-gpu-aggregate.cjs'
      - 'code/build/scripts/measure-gpu-sample.ps1'
permissions:
  contents: read

jobs:
  compare:
    runs-on: windows-latest
    timeout-minutes: 48
    defaults:
      run:
        working-directory: code/build
    env:
      MEASURE_SKIP_POWER: '1'
      MEASURE_TRIALS: '5'
      MEASURE_SAMPLE_SEC: '7'
      MEASURE_SETTLE_MS: '4000'
      MEASURE_DEADLINE_MIN: '42'
      E2E_LAUNCH_TIMEOUT_MS: '45000'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: code/build/package-lock.json
      - name: Install dependencies and verify the Electron harness
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node -p "require('electron')"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test scripts/test-measure-sample-guard.cjs scripts/test-edge-target.cjs scripts/test-measure-native-browser.cjs scripts/test-measure-gpu-aggregate.cjs
      - name: Build an unpacked app for the packaged comparison
        if: contains(github.event.head_commit.message, '[packaged-edge]')
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npx --no-install electron-builder --win dir --x64 --config electron-builder.json --config.directories.output=packaged-edge-dist --publish never
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $app = Join-Path $PWD 'packaged-edge-dist/win-unpacked/Dexerion.exe'
          if (-not (Test-Path $app)) { throw 'Unpacked Dexerion browser not found' }
          "DEX_NATIVE_PACKAGED_APP=$app" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Measure Edge and Dexerion on the same virtual Windows host
        env:
          FOUR_TRIALS: ${{ contains(github.event.head_commit.message, '[four-trials]') }}
          SEED_PROFILE: ${{ contains(github.event.head_commit.message, '[seeded-profile]') }}
          LAUNCH_CONTROL: ${{ contains(github.event.head_commit.message, '[launch-control]') }}
          NATIVE_SOAK: ${{ contains(github.event.head_commit.message, '[native-soak]') }}
          NATIVE_LAUNCH: ${{ contains(github.event.head_commit.message, '[native-launch]') }}
          FOCUS_ONLY: ${{ contains(github.event.head_commit.message, '[edge-foreground]') }}
          LIGHT_WORKLOADS: ${{ contains(github.event.head_commit.message, '[edge-light-workloads]') }}
          DISTINCT_HOSTS: ${{ contains(github.event.head_commit.message, '[edge-distinct-sites]') }}
          STATIC_BACKGROUND: ${{ contains(github.event.head_commit.message, '[edge-static-background]') }}
          EXTENDED_SAMPLE: ${{ contains(github.event.head_commit.message, '[edge-extended-sample]') }}
        run: |
          if ($env:FOUR_TRIALS -eq 'true') { $env:MEASURE_TRIALS = '4' }
          if ($env:SEED_PROFILE -eq 'true') { $env:MEASURE_SEED_PROFILE = '1' }
          if ($env:LAUNCH_CONTROL -eq 'true') { $env:MEASURE_LAUNCH_CONTROL = '1' }
          if ($env:NATIVE_SOAK -eq 'true') { $env:MEASURE_SETTLE_MS = '22000' }
          if ($env:EXTENDED_SAMPLE -eq 'true') { $env:MEASURE_SAMPLE_SEC = '15' }
          if ($env:NATIVE_LAUNCH -eq 'true') { $env:MEASURE_NATIVE_LAUNCH = '1' }
          if ($env:FOCUS_ONLY -eq 'true') { $env:MEASURE_SCENARIOS = 'active-browsing' }
          if ($env:LIGHT_WORKLOADS -eq 'true') { $env:MEASURE_SCENARIOS = 'active-browsing,idle' }
          if ($env:DISTINCT_HOSTS -eq 'true') {
            $env:MEASURE_SCENARIOS = 'background-tabs,multitasking'
            $env:MEASURE_DISTINCT_LOOPBACK_HOSTS = '1'
          }
          if ($env:STATIC_BACKGROUND -eq 'true') {
            if ($env:DISTINCT_HOSTS -ne 'true' -or $env:NATIVE_LAUNCH -ne 'true') { throw 'The static background control requires distinct hosts and native launch' }
            $env:MEASURE_STATIC_BACKGROUND = '1'
          }
          $env:MEASURE_OUT_DIR = Join-Path $env:RUNNER_TEMP 'dexerion-edge'
          node scripts/measure-protocol.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $file = Join-Path $env:MEASURE_OUT_DIR 'measure-protocol-main.json'
          node scripts/grade-edge-target.cjs $file
          if ($LASTEXITCODE -gt 1) { exit $LASTEXITCODE }
          node -e "const r=require(process.argv[1]); const names=r.config.scenarioOrder; if(names.some(s=>['edge','dexerion'].some(b=>['cpu','ram'].some(a=>!(r.scenarios?.[s]?.[b]?.summary?.[a]?.n>=3)))))process.exit(1)" $file
      - name: Keep Windows comparison evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloud-windows-edge-comparison
          path: ${{ runner.temp }}/dexerion-edge/measure-protocol-main.json
          if-no-files-found: ignore
          retention-days: 7
