name: Build branded Windows and Linux installers

on:
  push:
    branches: [main, installer-ci-validation]
  workflow_dispatch:

permissions:
  contents: read

# Update this to a validated commit on installer-tooling to change the Setup UI.
# Only the packaging helpers are imported. Application source is always the
# exact main commit being built. No releases, tags, or pushes are made here.
env:
  INSTALLER_TOOLING_SHA: 35b4bcc0c44e4fa5fc43c0962556bb28161824d2
  CSC_IDENTITY_AUTO_DISCOVERY: 'false'

jobs:
  plan:
    name: Identify commits to build
    if: github.event.deleted != true
    runs-on: ubuntu-24.04
    outputs:
      commits: ${{ steps.matrix.outputs.commits }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Build each newly pushed first-parent commit
        id: matrix
        shell: bash
        env:
          BEFORE: ${{ github.event.before }}
          TIP: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$TIP" =~ ^[0-9a-f]{40}$ ]]
          if [[ -z "$BEFORE" || "$BEFORE" == 0000000000000000000000000000000000000000 ]]; then
            commits="$TIP"
          else
            [[ "$BEFORE" =~ ^[0-9a-f]{40}$ ]]
            if ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
              git fetch --no-tags origin "$BEFORE"
            fi
            commits="$(git rev-list --first-parent --reverse "$TIP" --not "$BEFORE")"
            if [[ -z "$commits" ]]; then commits="$TIP"; fi
          fi
          count="$(wc -l <<< "$commits")"
          if (( count > 256 )); then
            echo '::error::This push exceeds the 256-commit matrix limit. Push smaller batches.'
            exit 1
          fi
          printf 'commits=%s\n' "$(jq -cn --arg lines "$commits" '$lines|split("\n")')" >> "$GITHUB_OUTPUT"

  windows:
    name: Windows x64 · ${{ matrix.commit }}
    needs: plan
    runs-on: windows-2025
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        commit: ${{ fromJSON(needs.plan.outputs.commits) }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ matrix.commit }}
          path: app
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.INSTALLER_TOOLING_SHA }}
          path: installer-tooling
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: app/code/build/package-lock.json
      - name: Install locked dependencies
        working-directory: app/code/build
        run: npm ci --include=dev
      - name: Build and verify custom Windows Setup
        shell: pwsh
        env:
          SOURCE_SHA: ${{ matrix.commit }}
        run: |
          $script = Join-Path $env:GITHUB_WORKSPACE 'installer-tooling/code/build/installer/branded/ci-build.ps1'
          $source = Join-Path $env:GITHUB_WORKSPACE 'app'
          $out = Join-Path $env:RUNNER_TEMP "dexerion-windows-$env:SOURCE_SHA"
          & $script -SourceDirectory $source -SourceCommit $env:SOURCE_SHA -ToolingCommit $env:INSTALLER_TOOLING_SHA -OutputDirectory $out
          if (-not $?) { exit 1 }
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: dexerion-windows-x64-${{ matrix.commit }}
          path: ${{ runner.temp }}/dexerion-windows-${{ matrix.commit }}/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  linux:
    name: Linux x64 · ${{ matrix.commit }}
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        commit: ${{ fromJSON(needs.plan.outputs.commits) }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ matrix.commit }}
          path: app
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.INSTALLER_TOOLING_SHA }}
          path: installer-tooling
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: app/code/build/package-lock.json
      - name: Install Linux packaging and test dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libarchive-tools libfuse2t64 xvfb xauth
      - name: Install locked dependencies
        working-directory: app/code/build
        run: npm ci --include=dev
      - name: Verify the existing Linux launcher
        working-directory: app
        run: node --test .github/packaging/linux-launcher.test.cjs
      - name: Package the pushed app with the existing Linux launcher
        working-directory: app/code/build
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const path = require('node:path');
          const fs = require('node:fs');
          const config = require('./electron-builder.json');
          config.directories = { ...config.directories, output: 'dist' };
          config.extraMetadata = { ...config.extraMetadata, author: 'Dexerion',
            homepage: 'https://github.com/' + process.env.GITHUB_REPOSITORY };
          config.linux = {
            target: ['AppImage'],
            artifactName: 'Dexerion-${version}-${arch}.${ext}',
            icon: '../code/assets/logo.png',
            category: 'Network',
            executableName: 'dexerion',
            desktop: { entry: { StartupWMClass: 'Dexerion' } },
          };
          config.afterPack = path.resolve('../../.github/packaging/after-pack.cjs');
          fs.writeFileSync('electron-builder.ci.json', JSON.stringify(config, null, 2));
          NODE
          npx --no-install electron-builder --linux AppImage --x64 --config electron-builder.ci.json --publish never
      - name: Package and smoke-test custom Linux Setup
        shell: bash
        env:
          SOURCE_SHA: ${{ matrix.commit }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/dexerion-linux-$SOURCE_SHA"
          mkdir -p "$out"
          shopt -s nullglob
          payloads=( "$GITHUB_WORKSPACE"/app/code/build/dist/*.AppImage )
          [[ ${#payloads[@]} -eq 1 ]]
          setup="$out/Dexerion-Setup-Linux-x64.run"
          node --test "$GITHUB_WORKSPACE/installer-tooling/.github/packaging/linux-installer/install.test.cjs"
          node "$GITHUB_WORKSPACE/installer-tooling/.github/packaging/linux-installer/build.cjs" \
            --runtime "$GITHUB_WORKSPACE/app/code/build/dist/linux-unpacked" \
            --payload "${payloads[0]}" --logo "$GITHUB_WORKSPACE/app/code/code/assets/logo.png" \
            --output "$setup"
          chmod +x "$setup"
          "$setup" --verify
          xvfb-run -a "$setup" --smoke-test
          (cd "$out"; sha256sum Dexerion-Setup-Linux-x64.run > Dexerion-Setup-Linux-x64.run.sha256)
          node -e 'console.log(JSON.stringify({source:process.env.SOURCE_SHA,installerTooling:process.env.INSTALLER_TOOLING_SHA,runner:"ubuntu-24.04",platform:"linux",arch:"x64",githubRun:process.env.GITHUB_RUN_ID},null,2))' > "$out/build-provenance.json"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: dexerion-linux-x64-${{ matrix.commit }}
          path: ${{ runner.temp }}/dexerion-linux-${{ matrix.commit }}/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
