name: Dexerion Snip discarded preview retention
on:
  push:
    branches: [dev-V]
    paths:
      - '.github/workflows/dexerion-snip-preview-retention.yml'
      - 'code/code/src/renderer/snip.html'
      - 'code/build/e2e/snip-preview-retention.spec.js'
      - 'code/build/scripts/test-snip-preview-retention.cjs'
permissions:
  contents: read
jobs:
  desktop:
    if: github.ref == 'refs/heads/dev-V'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 14
    defaults:
      run:
        working-directory: code/build
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: code/build/package-lock.json
      - name: Install locked desktop test dependencies
        run: npm ci --include=dev
      - name: Exercise actual Snip without changing sandbox settings
        shell: bash
        run: |
          set -euo pipefail
          export DEBUG=pw:browser
          export DEX_SNIP_NATIVE=candidate DEX_SNIP_OUT="$RUNNER_TEMP/snip-retention-candidate.json"
          export DEX_SNIP_PHASE=candidate
          node --test scripts/test-snip-preview-retention.cjs
          args=(npm run test:e2e -- e2e/snip-preview-retention.spec.js --output "$RUNNER_TEMP/snip-retention-trace-candidate")
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a -s '-screen 0 1280x900x24' "${args[@]}"
          else
            "${args[@]}"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dexerion-snip-retention-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/snip-retention-*.json
            ${{ runner.temp }}/snip-retention-trace-candidate/
          if-no-files-found: ignore
          retention-days: 7
