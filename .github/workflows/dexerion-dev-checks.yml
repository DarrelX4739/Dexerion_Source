name: Dexerion dev checks
on:
  push:
    branches: [darrel-dev-1]
    paths:
      - '.github/workflows/dexerion-dev-checks.yml'
      - '.github/packaging/**'
      - 'code/build/**'
      - 'code/code/**'
permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: code/build
    env:
      # The tests use a visible virtual display and throwaway Electron profiles.
      # This software-rendering runner is not an Edge performance reference.
      E2E_LAUNCH_TIMEOUT_MS: '45000'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: code/build/package-lock.json
      - name: Install Electron and dependencies
        id: electron
        run: |
          npm ci
          node -p "require('electron')"
      - name: Verify source and run unit checks
        run: |
          npm run verify
          node --test scripts/test-*.cjs ../../.github/packaging/linux-launcher.test.cjs
      - name: Check real Electron boot, AI and toolbar controls
        run: xvfb-run -a npm run test:e2e -- e2e/boot.spec.js e2e/sidebar.spec.js e2e/search.spec.js e2e/site-offline-assets.spec.js e2e/performance-surfaces.spec.js
      - name: Compare whole-browser CPU and RAM against Chrome
        env:
          DEX_CLOUD_TRIALS: '5'
        run: xvfb-run -a -s '-screen 0 1280x1024x24' node scripts/measure-cloud-linux.cjs
      - name: Keep comparison evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloud-linux-comparison
          path: code/build/cloud-comparison.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Run full Electron regression suite at milestones
        if: ${{ !cancelled() && steps.electron.outcome == 'success' && contains(github.event.head_commit.message, '[full-regression]') }}
        run: xvfb-run -a npm run test:e2e
      - name: Keep failed Electron test evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: electron-test-failures
          path: code/build/test-results/
          if-no-files-found: ignore
          retention-days: 7
