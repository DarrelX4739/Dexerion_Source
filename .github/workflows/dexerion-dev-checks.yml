name: Dexerion dev checks
on:
  push:
    branches: [darrel-dev-1]
    paths:
      - '.github/workflows/dexerion-dev-checks.yml'
      - '.github/packaging/**'
      - 'code/build/**'
      - 'code/code/**'
permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: code/build
    env:
      # The tests use a visible virtual display and throwaway Electron profiles.
      # This software-rendering runner is not an Edge performance reference.
      E2E_LAUNCH_TIMEOUT_MS: '45000'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: code/build/package-lock.json
      - name: Install Electron and dependencies
        id: electron
        run: |
          npm ci
          node -p "require('electron')"
      - name: Verify source and run unit checks
        run: |
          npm test
          node --test ../../.github/packaging/linux-launcher.test.cjs
      - name: Check real Electron boot, AI and toolbar controls
        run: xvfb-run -a npm run test:e2e -- e2e/boot.spec.js e2e/sidebar.spec.js e2e/search.spec.js e2e/site-offline-assets.spec.js e2e/performance-surfaces.spec.js e2e/cold-accounts.spec.js e2e/chat-batch-scroll.spec.js e2e/downloads-progress.spec.js
      - name: Check out the pre-optimisation reference at A/B milestones
        if: contains(github.event.head_commit.message, '[paired-ab]')
        uses: actions/checkout@v4
        with:
          ref: ce1ea874d339ceb639598f859bdfe8f298ef3ba2
          path: .ab-reference
          persist-credentials: false
      - name: Install the reference's own locked dependencies
        if: contains(github.event.head_commit.message, '[paired-ab]')
        working-directory: .ab-reference/code/build
        run: |
          npm ci
          node -p "require('electron')"
      - name: Compare whole-browser CPU and RAM against Chrome
        env:
          DEX_CLOUD_TRIALS: '5'
        run: |
          ref="$GITHUB_WORKSPACE/.ab-reference/code/build"
          if [[ -d "$ref/node_modules" ]]; then export DEX_CLOUD_REFERENCE_BUILD="$ref"; fi
          xvfb-run -a -s '-screen 0 1280x1024x24' node scripts/measure-cloud-linux.cjs
      - name: Compare the dormant-account memory change on the same build
        if: contains(github.event.head_commit.message, '[cold-accounts-ab]')
        run: xvfb-run -a -s '-screen 0 1280x1024x24' node scripts/measure-cold-accounts.cjs
      - name: Keep comparison evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloud-linux-comparison
          path: |
            code/build/cloud-comparison.json
            code/build/cloud-cold-account-comparison.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Install the window manager required by fullscreen tests
        id: desktop
        if: ${{ !cancelled() && steps.electron.outcome == 'success' && contains(github.event.head_commit.message, '[full-regression]') }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends openbox x11-utils
      - name: Run full Electron regression suite at milestones
        if: ${{ !cancelled() && steps.electron.outcome == 'success' && steps.desktop.outcome == 'success' }}
        run: |
          xvfb-run -a -s '-screen 0 1280x1024x24' bash -e -c '
            openbox --sm-disable >/tmp/dex-openbox.log 2>&1 &
            wm=$!
            trap "kill $wm 2>/dev/null || true" EXIT
            for i in {1..40}; do
              if xprop -root _NET_SUPPORTING_WM_CHECK | grep -q "window id"; then break; fi
              sleep 0.25
            done
            xprop -root _NET_SUPPORTING_WM_CHECK | grep -q "window id"
            npm run test:e2e
          '
      - name: Keep failed Electron test evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: electron-test-failures
          path: code/build/test-results/
          if-no-files-found: ignore
          retention-days: 7
