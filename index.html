<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dexerion — Join the Waitlist</title>
<meta name="description" content="Dexerion — A real browser, from scratch. Join the waitlist with Google.">
<style>
/* Dexerion "nof1 paper atelier" tokens (mirrors assets/page-theme.css). Accent is a signal, never a wash. */
:root{
  color-scheme:light;
  --paper:#f5f3ef;--paper-raised:#fcfbf9;--paper-field:#fff;
  --paper-ink:#1e1c19;--paper-ink-2:#57534b;--paper-muted:#7c766c;--paper-faint:#a49c90;
  --paper-line:rgba(30,28,25,.10);--paper-line-strong:rgba(30,28,25,.19);
  --paper-hover:rgba(30,28,25,.045);--paper-highlight:rgba(255,255,255,.9);
  --ok:#2f7d4a;--err:#b23b35;
  --r-md:8px;--r-lg:10px;--r-xl:12px;--r-pill:999px;
  --sh-2:0 1px 2px rgba(30,28,25,.05),0 8px 22px -12px rgba(30,28,25,.16);
  --sh-3:0 2px 4px rgba(30,28,25,.06),0 20px 44px -22px rgba(30,28,25,.22);
  --font:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,sans-serif;
  --font-display:"Iowan Old Style","Palatino Linotype","Book Antiqua",Georgia,serif;
  --font-mono:"Cascadia Mono",Consolas,monospace;
  --ease:cubic-bezier(.22,.61,.36,1);--dur:160ms;
  --accent:#35c4ff;--accent-ink:#07131a;
  --pbg:var(--paper);--pcard:var(--paper-raised);--pcard-2:var(--paper-field);
  --pfield:var(--paper-field);--pfg:var(--paper-ink);--pfg-2:var(--paper-ink-2);
  --pmuted:var(--paper-muted);--pfaint:var(--paper-faint);
  --pborder:var(--paper-line);--pborder-2:var(--paper-line-strong);--phl:var(--paper-highlight);
  --pbtn:color-mix(in srgb,var(--paper-ink) 5%,transparent);
  --pbtnfg:var(--paper-ink-2);
}
[data-theme="dark"]{
  color-scheme:dark;
  --paper:#121110;--paper-raised:#1b1917;--paper-field:#161413;
  --paper-ink:#f1eee8;--paper-ink-2:#c9c3b9;--paper-muted:#a39c90;--paper-faint:#736c62;
  --paper-line:rgba(255,255,255,.10);--paper-line-strong:rgba(255,255,255,.18);
  --paper-hover:rgba(255,255,255,.05);--paper-highlight:rgba(255,255,255,.055);
  --ok:#6ec98a;--err:#e47c73;
  --sh-2:0 1px 2px rgba(0,0,0,.35),0 10px 26px -14px rgba(0,0,0,.6);
  --sh-3:0 2px 4px rgba(0,0,0,.4),0 22px 48px -24px rgba(0,0,0,.75);
  --pbtnfg:#d6d0c7;
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--pbg);color:var(--pfg);font-family:var(--font);font-size:14px;line-height:1.5;display:flex;flex-direction:column;align-items:center;padding:11vh 24px 56px}
.mark{display:flex;flex-direction:column;align-items:center;text-align:center;animation:rise .4s var(--ease) both}
.mark .crest{width:74px;height:74px;border-radius:20px;display:grid;place-items:center;font-family:var(--font-display);font-size:34px;font-weight:700;background:linear-gradient(160deg,var(--pcard-2),var(--pcard));border:1px solid var(--pborder-2);box-shadow:var(--sh-3),inset 0 1px 0 var(--phl);color:var(--accent)}
.mark h1{font-family:var(--font-display);font-size:30px;letter-spacing:.14em;text-transform:uppercase;margin:20px 0 0;font-weight:600}
.mark .sub{color:var(--pmuted);font-size:13px;margin:7px 0 0}
.eyebrow{font-family:var(--font-display);font-size:10.5px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);margin-bottom:12px}
.card{width:min(520px,94vw);margin-top:28px;padding:24px;border-radius:var(--r-xl);background:var(--pcard);border:1px solid var(--pborder-2);box-shadow:var(--sh-3),inset 0 1px 0 var(--phl);text-align:center}
.card h2{font-size:20px;margin:0}
.card p{color:var(--pmuted);font-size:13px;margin:8px 0 0;line-height:1.6}
/* Waitlist button: Dexerion .btn.primary — accent signal only */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;padding:12px 22px;font-size:13.5px;font-weight:600;font-family:inherit;color:var(--accent-ink);background:var(--accent);border:1px solid transparent;border-radius:var(--r-md);cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:filter var(--dur) var(--ease),transform var(--dur) var(--ease),box-shadow var(--dur) var(--ease)}
.btn:hover:not(:disabled){filter:brightness(1.08);transform:translateY(-1px);box-shadow:0 6px 18px -8px var(--accent)}
.btn:disabled{opacity:.55;cursor:wait;transform:none}
.btn svg{flex:none}
#waitlist-btn{margin-top:18px;min-width:260px}
#waitlist-msg{margin-top:14px;min-height:20px;font-size:13px;font-weight:550}
#waitlist-msg.ok{color:var(--ok)}
#waitlist-msg.err{color:var(--err)}
#waitlist-msg.info{color:var(--pmuted);font-weight:400}
.hint{margin-top:10px;font-family:var(--font-mono);font-size:11px;color:var(--pfaint)}
.theme-toggle{position:fixed;top:16px;right:16px;background:var(--pbtn);color:var(--pbtnfg);border:1px solid var(--pborder);border-radius:var(--r-pill);padding:6px 13px;font-size:12px;cursor:pointer;font-family:inherit}
.theme-toggle:hover{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 50%,transparent)}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<button class="theme-toggle" id="theme-toggle" type="button" title="Toggle theme">Light / Dark</button>

<div class="mark">
  <div class="crest">D</div>
  <h1>Dexerion</h1>
  <p class="sub">A real browser, from scratch.</p>
</div>

<div class="card">
  <div class="eyebrow">Waitlist</div>
  <h2>Get early access</h2>
  <p>One click with Google. Your email is stored only after a successful sign-in, and each email can join once.</p>

  <!-- ============ WAITLIST BUTTON FLOW ONLY — edit Firebase config + nothing else above/below ============ -->
  <button class="btn" id="waitlist-btn" type="button">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M21.35 11.1H12v2.9h5.35c-.5 2.4-2.55 3.5-5.35 3.5a5.9 5.9 0 1 1 0-11.8c1.5 0 2.85.55 3.9 1.45l2.05-2.05A8.75 8.75 0 1 0 12 20.75c4.4 0 7.85-3.05 7.85-7.5 0-.7-.1-1.45-.5-2.15z"/></svg>
    <span id="waitlist-label">Join the Waitlist with Google</span>
  </button>
  <div id="waitlist-msg" class="info" role="status" aria-live="polite"></div>
  <div class="hint">Secure Google sign-in · no password stored</div>
  <!-- ============ /WAITLIST BUTTON FLOW ONLY ============ -->
</div>

<!-- Firebase compat SDKs (no build step — works as a static index.html on GitHub Pages) -->
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-analytics-compat.js"></script>
<script>
/* ---------- theme (Dexerion dark default, follows page-theme.js convention) ---------- */
(function(){
  var root=document.documentElement;
  try{
    var saved=localStorage.getItem('dex-theme');
    if(saved)root.setAttribute('data-theme',saved);
    else if(window.matchMedia&&window.matchMedia('(prefers-color-scheme: light)').matches)root.setAttribute('data-theme','light');
  }catch(e){}
  document.getElementById('theme-toggle').onclick=function(){
    var next=root.getAttribute('data-theme')==='light'?'dark':'light';
    root.setAttribute('data-theme',next);
    try{localStorage.setItem('dex-theme',next);}catch(e){}
  };
})();

/* ================= WAITLIST BUTTON FLOW ONLY (Google -> Firebase, deduped) =================
   Deploy: put THIS file alone as index.html in a GitHub repo -> Settings -> Pages -> Deploy from branch.
   Firestore rules in use (betaSignups, locked down — paste into Firestore -> Rules):
     match /betaSignups/{doc} {
       allow create: if request.auth != null
                     && request.auth.token.email != null
                     && request.auth.token.email.lower() == request.resource.data.email.lower()
                     && doc == request.resource.data.email.lower()
                     && !exists(/databases/$(database)/documents/betaSignups/$(request.resource.data.email.lower()))
                     && request.resource.data.keys().hasOnly(['email', 'source', 'createdAt'])
                     && request.resource.data.email is string
                     && request.resource.data.email.size() > 5
                     && request.resource.data.email.size() < 255
                     && request.resource.data.email.matches('^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$')
                     && request.resource.data.source == 'landing-page'
                     && request.resource.data.createdAt == request.time;
       allow read, update, delete: if false;
     }
   Why these lines matter: request.auth != null stops anonymous writes (sign-in
   can't be bypassed via the API); doc == email + !exists() makes a second
   signup with the same email fail server-side, not just in the page script.
========================================================================================== */
var FIREBASE_CONFIG = {
  apiKey: "AIzaSyA-IUWxMDywZDhyFVpeWwy5MBT266Lzlnk",
  authDomain: "dexerion-browse.firebaseapp.com",
  projectId: "dexerion-browse",
  storageBucket: "dexerion-browse.firebasestorage.app",
  messagingSenderId: "673207882418",
  appId: "1:673207882418:web:b89c8a778a145c6e5a6fab",
  measurementId: "G-D1YELMLZQ1"
};

(function(){
  var btn=document.getElementById('waitlist-btn');
  var label=document.getElementById('waitlist-label');
  var msg=document.getElementById('waitlist-msg');

  function say(text,kind){msg.textContent=text;msg.className=kind||'info';}
  function setBusy(busy,text){
    btn.disabled=busy;
    if(text)label.textContent=text;
  }

  var app,auth,db;
  try{
    app=firebase.initializeApp(FIREBASE_CONFIG);
    auth=firebase.auth();
    db=firebase.firestore();
    try{
      if(firebase.analytics)firebase.analytics();
    }catch(analyticsErr){/* analytics is optional — never blocks signup */}
  }catch(err){
    say('Could not start sign-in. Please try again later.','err');
    return;
  }

  btn.addEventListener('click',function(){
    say('Connecting to Google…','info');
    setBusy(true,'Connecting…');
    var provider=new firebase.auth.GoogleAuthProvider();
    provider.setCustomParameters({prompt:'select_account'});

    auth.signInWithPopup(provider).then(function(result){
      var user=result&&result.user;
      var email=user&&user.email?user.email.trim().toLowerCase():'';
      if(!email){
        // No email -> store NOTHING
        say('Sign-in did not return an email. Nothing was saved — please try again.','err');
        return auth.signOut().catch(function(){}).then(function(){setBusy(false,'Join the Waitlist with Google');});
      }
      // One doc per email: the doc id IS the lowercase email, so a second
      // signup with the same address hits the duplicate branch below (and the
      // security rules reject it server-side too). Matches `betaSignups` rules.
      var ref=db.collection('betaSignups').doc(email);
      return ref.get().then(function(snap){
        if(snap.exists){
          // Duplicate -> store NOTHING new
          say('This email is already on the waitlist.','err');
          setBusy(false,'Join the Waitlist with Google');
          return null;
        }
        // Field set must match the rules exactly: email + source + createdAt only.
        return ref.set({
          email:email,
          source:'landing-page',
          createdAt:firebase.firestore.FieldValue.serverTimestamp()
        }).then(function(){
          say('You are on the list! We will be in touch.','ok');
          setBusy(false,'You are on the Waitlist ✓');
        });
      });
    }).catch(function(err){
      // Any failure (popup closed, network, unauthorized domain…) -> store NOTHING
      var code=err&&err.code;
      if(code==='auth/popup-closed-by-user'||code==='auth/cancelled-popup-request'){
        say('Sign-in was cancelled. Nothing was saved.','err');
      }else if(code==='auth/popup-blocked'){
        say('Popup was blocked. Allow popups and try again. Nothing was saved.','err');
      }else if(code==='auth/unauthorized-domain'){
        say('This site is not authorized for sign-in. Nothing was saved.','err');
      }else if(code==='auth/network-request-failed'){
        say('Network error during sign-in. Nothing was saved — check connection and retry.','err');
      }else if(code==='permission-denied'){
        say('Could not save your signup — this email may already be on the list.','err');
      }else{
        say('Google sign-in failed. Nothing was saved — please try again.','err');
      }
      setBusy(false,'Join the Waitlist with Google');
    });
  });
})();
</script>
</body>
</html>
